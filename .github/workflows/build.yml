name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Sign APK (Debug Key)
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/app-debug.apk build_output/Minecraft-Manager.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Minecraft Manager v1.0.0
          body: |
            Minecraft Mod, Skin ve Texture Pack Yöneticisi APK
            - Mod (.mcaddon / .mcpack) Yükleme & Yönetimi
            - Skine (.png) Dönüştürme & Yükleme
            - Texture Pack Kurulumu ve Entegrasyonu
            - Minecraft Bedrock doğrudan içe aktarma desteği
          files: build_output/Minecraft-Manager.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
