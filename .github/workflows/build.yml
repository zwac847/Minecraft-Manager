name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/app-debug.apk build_output/Minecraft-Manager.apk

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build_output/Minecraft-Manager.apk"
          tag: "v1.0.${{ github.run_number }}"
          name: "Minecraft Manager v1.0.${{ github.run_number }}"
          body: "Minecraft Mod, Skin ve Texture Pack Yöneticisi APK"
          token: ${{ secrets.GITHUB_TOKEN }}
